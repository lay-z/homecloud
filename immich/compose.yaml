name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:v3@sha256:fc880c1bf665b4aab1e74c15e56ab871225989cd546536e6b77e771869af06bd
    restart: unless-stopped
    env_file:
      - .env
      - .secrets
    ports:
      - "127.0.0.1:2283:2283"
    volumes:
      - ${IMMICH_UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - redis
      - database
    labels:
      - traefik.enable=true
      - traefik.http.routers.immich.rule=Host(`photos.${BASE_DOMAIN}`)
      - traefik.http.routers.immich.entrypoints=websecure
      - traefik.http.routers.immich.tls.certresolver=le
      - traefik.http.services.immich.loadbalancer.server.url=http://127.0.0.1:2283
      - wud.link.changelog=https://github.com/immich-app/immich/releases

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:v3@sha256:739405742a79bd7447227c553bb62ed5491aa36acf00bc667af7f9c93b6fae91
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ${DATA_ROOT}/immich/model-cache:/cache
    labels:
      - wud.link.changelog=https://github.com/immich-app/immich/releases

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:1c2b25b09f354c66fe994733acdf12fcfd4bdf6f3bd92b88a93a70378d884056
    restart: unless-stopped
    volumes:
      - ${DATA_ROOT}/immich/redis:/data
    healthcheck:
      test: redis-cli ping || exit 1
    labels:
      - wud.link.changelog=https://github.com/valkey-io/valkey/releases

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ${DATA_ROOT}/immich/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    labels:
      - wud.link.changelog=https://github.com/immich-app/postgres/releases
