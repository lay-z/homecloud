# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
#
# Authentik configuration for What's Up Docker.
#
# This file is mounted read-only at /blueprints/custom and is discovered and
# applied by authentik automatically, so the OAuth2 provider, the application,
# and the access policy are versioned with the stack instead of clicked into
# the admin interface.
#
# Credentials are read from the root .env, which is passed into the authentik
# containers by compose. Rotating WUD_OIDC_CLIENT_SECRET and recreating both
# services is enough to roll the client secret.
version: 1
metadata:
  name: homelab-wud
  labels:
    blueprints.goauthentik.io/description: What's Up Docker OIDC client

entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: wud-provider
    identifiers:
      name: wud
    attrs:
      name: wud
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      client_type: confidential
      client_id: !Env WUD_OIDC_CLIENT_ID
      client_secret: !Env WUD_OIDC_CLIENT_SECRET
      # WUD reads the groups claim from the ID token or userinfo. The profile
      # scope mapping is what emits "groups"; the openid and email mappings
      # supply the subject and the username claim.
      include_claims_in_id_token: true
      redirect_uris:
        - matching_mode: strict
          url: !Format ["%s/auth/oidc/authentik/cb", !Env WUD_PUBLIC_URL]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    id: wud-app
    identifiers:
      slug: wud
    attrs:
      name: What's Up Docker
      provider: !KeyOf wud-provider
      meta_launch_url: !Env WUD_PUBLIC_URL
      meta_description: Container update monitor
      meta_publisher: homelab
      open_in_new_tab: true

  # Only members of the authentik administrator group may authorize. WUD maps
  # the same group to its own admin role via WUD_AUTH_OIDC_AUTHENTIK_ADMINGROUP.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf wud-app
      group: !Find [authentik_core.group, [name, "authentik Admins"]]
      order: 0
    attrs:
      enabled: true
