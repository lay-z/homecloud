name: tandoor

services:
  db_recipes:
    container_name: tandoor-db_recipes-1
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ${DATA_ROOT}/tandoor/postgresql:/var/lib/postgresql/data
    labels:
      - wud.link.changelog=https://www.postgresql.org/docs/release/

  web_recipes:
    container_name: tandoor-web_recipes-1
    image: vabene1111/recipes:latest@sha256:6c467bf484044a0305ff39bed5badb48b58bb963d4276fc248e101921151895b
    restart: unless-stopped
    env_file:
      - .env
      - .secrets
    environment:
      TZ: ${TZ}
      ALLOWED_HOSTS: recipes.${BASE_DOMAIN}
    ports:
      - "127.0.0.1:8979:80"
    volumes:
      - ${DATA_ROOT}/tandoor/staticfiles:/opt/recipes/staticfiles
      - ${DATA_ROOT}/tandoor/mediafiles:/opt/recipes/mediafiles
    depends_on:
      - db_recipes
    labels:
      - traefik.enable=true
      - traefik.http.routers.tandoor.rule=Host(`recipes.${BASE_DOMAIN}`)
      - traefik.http.routers.tandoor.entrypoints=websecure
      - traefik.http.routers.tandoor.tls.certresolver=le
      - traefik.http.services.tandoor.loadbalancer.server.url=http://127.0.0.1:8979
      - wud.link.changelog=https://github.com/vabene1111/recipes/releases
