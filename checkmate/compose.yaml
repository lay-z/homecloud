name: checkmate

services:
  checkmate:
    container_name: checkmate-checkmate-1
    image: ghcr.io/bluewave-labs/checkmate:latest@sha256:f66a53fce561a526f939d994337843ac03211364daa3fd1de3a492c895c503d5
    restart: unless-stopped
    stop_grace_period: 60s
    env_file:
      - .env
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      DB_CONNECTION_STRING: mongodb://mongodb:27017/uptime_db
      CLIENT_HOST: https://status.${BASE_DOMAIN}
      CLIENT_CONFIG_CLIENT_HOST: https://status.${BASE_DOMAIN}
    ports:
      - "127.0.0.1:52345:52345"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:52346/livez',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      start_period: 60s
      start_interval: 2s
      retries: 3
    depends_on:
      mongodb:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - "traefik.http.routers.checkmate.rule=Host(`status.${BASE_DOMAIN}`) || Host(`info.status.${BASE_DOMAIN}`)"
      - traefik.http.routers.checkmate.entrypoints=websecure
      - traefik.http.routers.checkmate.tls.certresolver=le
      - traefik.http.services.checkmate.loadbalancer.server.url=http://127.0.0.1:52345
      - wud.link.changelog=https://github.com/bluewave-labs/Checkmate/releases

  mongodb:
    container_name: checkmate-mongodb-1
    image: mongo:8.0@sha256:479e85ced54ffb8a40dade1dcde2da2a9ae858515b9415e9cc54bfb8f0575d01
    restart: unless-stopped
    command: ["mongod", "--quiet", "--bind_ip_all"]
    volumes:
      - ${DATA_ROOT}/checkmate/mongo-data:/data/db
      - ${DATA_ROOT}/checkmate/mongo-configdb:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 5s
      timeout: 30s
      start_period: 0s
      start_interval: 1s
      retries: 30
    labels:
      - wud.link.changelog=https://www.mongodb.com/docs/manual/release-notes/

  capture:
    container_name: checkmate-capture-1
    image: ghcr.io/bluewave-labs/capture:latest@sha256:e7fefcdf2d26388807bbe158fa1a1011b4ecdc16efddb5964b63feb3c68020f7
    restart: unless-stopped
    environment:
      GIN_MODE: release
      API_SECRET: ${CAPTURE_API_SECRET:?CAPTURE_API_SECRET is required}
    volumes:
      - /etc/os-release:/etc/os-release:ro
    labels:
      - wud.link.changelog=https://github.com/bluewave-labs/capture/releases
